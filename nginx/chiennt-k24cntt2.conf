server {
    listen 8088;
    listen [::]:8088;

    server_name _;

    root /var/www/devops-hackathon-de003-chiennt/src;
    index index.html;

    access_log /var/log/nginx/chiennt-k24cntt2.access.log;
    error_log /var/log/nginx/chiennt-k24cntt2.error.log;

    location / {
        allow all;
        try_files $uri $uri/ =404;
    }
}
